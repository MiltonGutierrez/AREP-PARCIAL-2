<!DOCTYPE html>
<html>

<head>
    <title>Form Example</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <h1>Factors</h1>
    <form action="/factors">
        <label for="name">value:</label><br>
        <input type="text" id="valueFactor" name="valueFactor" value="10"><br><br>
        <input type="button" value="Submit" onclick="getFactors()">
    </form>
    <div id="getrespmsg"></div>

    <script>
        function getFactors() {
            let value = document.getElementById("valueFactor").value;
            const xhttp = new XMLHttpRequest();
            xhttp.onload = function () {
                document.getElementById("getrespmsg").innerHTML =
                    this.responseText;
            }
            xhttp.open("GET", "http://ec2-52-202-30-129.compute-1.amazonaws.com:8080/factors?value=" + value);
            xhttp.send();
        }
    </script>

    <h1>Primes</h1>
    <form action="/primes">
        <label for="name">value:</label><br>
        <input type="text" id="valuePrimes" name="valuePrimes" value="10"><br><br>
        <input type="button" value="Submit" onclick="getPrimes()">
    </form>
    <div id="getrespmsg2"></div>

    <script>
        function getPrimes() {
            let value = document.getElementById("valuePrimes").value;
            const xhttp = new XMLHttpRequest();
            xhttp.onload = function () {
                document.getElementById("getrespmsg2").innerHTML =
                    this.responseText;
            }
            xhttp.open("GET", "http://ec2-52-202-30-129.compute-1.amazonaws.com:8080/primes?value=" + value);
            xhttp.send();
        }
    </script>
</body>

</html>
